name: Docs

# Builds the documentation site (mkdocs.yml) in strict mode, so broken links, anchors and images fail
# the check, and publishes it to GitHub Pages from main.
# Repository setting required once: Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, tools/mkdocs/**, CHANGELOG.md, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, tools/mkdocs/**, CHANGELOG.md, .github/workflows/docs.yml]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Build (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
