name: Release

# Builds the Linux and macOS tarballs and the Windows installer.
#   - Run workflow (Actions tab): files are attached to the run only, for testing; nothing is
#     published.
#   - Push a tag vX.Y.Z (equal to OCH_VERSION in include/omnicore/och.h): additionally creates a
#     draft GitHub Release with all three files and SHA256SUMS. Publish it by hand after testing.
# Each file is uploaded as-is (archive: false), so the Actions page offers the .tar.gz / .exe
# itself rather than a zip around it.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Read OCH_VERSION
        run: |
          version=$(sed -n 's/^#define OCH_VERSION "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' include/omnicore/och.h)
          test -n "$version" || { echo "OCH_VERSION not found"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match OCH_VERSION $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # Oldest supported runner: the binary then also runs on distributions with an older glibc.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libusb-1.0-0-dev
      - name: Build and stage
        run: OCH_BUILD_DIR=build/linux OCH_INSTALL_DIR=dist/OmniCoreHost-linux bash tools/build-linux.sh
      - name: Test
        # The sync test depends on wall-clock timing and fails on slow runners; run it locally.
        run: ctest --test-dir build/linux --output-on-failure -E '^sync$'
      - name: Check the staged och runs and reports the version
        run: |
          got=$(dist/OmniCoreHost-linux/bin/och version --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          test "$got" = "$VERSION" || { echo "och reports $got, expected $VERSION"; exit 1; }
      - name: Package
        run: tar -C dist -czf "dist/OmniCoreHost-$VERSION-linux-x86_64.tar.gz" OmniCoreHost-linux
      - uses: actions/upload-artifact@v7
        with:
          path: dist/OmniCoreHost-${{ env.VERSION }}-linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Oldest macOS the package runs on. Applies to libusb and OCH alike.
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      LIBUSB_VERSION: '1.0.30'
      LIBUSB_SHA256: fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: brew install ninja pkgconf
      # Homebrew's libusb targets the runner's own macOS version and is a dylib under /opt/homebrew,
      # which users may not have. Build a static universal libusb for the deployment target instead,
      # so the package depends on system libraries only.
      - name: Build static libusb
        run: |
          src="$RUNNER_TEMP/libusb-src"; prefix="$RUNNER_TEMP/libusb"
          mkdir -p "$src"
          curl -fsSL -o "$RUNNER_TEMP/libusb.tar.bz2" \
            "https://github.com/libusb/libusb/releases/download/v$LIBUSB_VERSION/libusb-$LIBUSB_VERSION.tar.bz2"
          echo "$LIBUSB_SHA256  $RUNNER_TEMP/libusb.tar.bz2" | shasum -a 256 -c -
          tar -xjf "$RUNNER_TEMP/libusb.tar.bz2" -C "$src" --strip-components 1
          cd "$src"
          ./configure --prefix="$prefix" --disable-shared --enable-static --disable-dependency-tracking \
            CFLAGS="-O2 -arch arm64 -arch x86_64"
          make -j"$(sysctl -n hw.ncpu)"
          make install
          lipo "$prefix/lib/libusb-1.0.a" -verify_arch arm64 x86_64
          echo "LIBUSB_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: Configure
        # libusb's macOS backend needs these beyond the IOKit/CoreFoundation that CMake already links.
        env:
          LDFLAGS: -lobjc -framework Security
          PKG_CONFIG_PATH: ${{ env.LIBUSB_PREFIX }}/lib/pkgconfig
        run: |
          cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$LIBUSB_PREFIX" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build and stage
        run: |
          cmake --build build/macos --parallel
          cmake --install build/macos --prefix "$PWD/dist/OmniCoreHost-macos"
      - name: Test
        # The sync test depends on wall-clock timing and fails on slow runners; run it locally.
        run: ctest --test-dir build/macos --output-on-failure -E '^sync$'
      - name: Check the staged binaries
        run: |
          cd dist/OmniCoreHost-macos
          got=$(bin/och version --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          test "$got" = "$VERSION" || { echo "och reports $got, expected $VERSION"; exit 1; }
          for f in bin/och lib/libomnicore.*.dylib; do
            [ -L "$f" ] && continue
            lipo "$f" -verify_arch arm64 x86_64 || { echo "$f is not universal"; exit 1; }
            if otool -L "$f" | grep -E '/opt/homebrew|/usr/local'; then echo "$f links a non-system library"; exit 1; fi
            minos=$(otool -l "$f" | awk '/minos/ {print $2}' | sort -u)
            test "$minos" = "$MACOSX_DEPLOYMENT_TARGET" || { echo "$f minos $minos"; exit 1; }
          done
      - name: Package
        run: tar -C dist -czf "dist/OmniCoreHost-$VERSION-macos-universal.tar.gz" OmniCoreHost-macos
      - uses: actions/upload-artifact@v7
        with:
          path: dist/OmniCoreHost-${{ env.VERSION }}-macos-universal.tar.gz
          archive: false
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      # The build scripts expect MinGW-w64 at C:\msys64\mingw64\bin, so use the runner's
      # preinstalled MSYS2 (release: false) instead of a fresh copy elsewhere.
      - uses: msys2/setup-msys2@v2
        with:
          release: false
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Check MinGW-w64 location
        run: |
          foreach($t in 'gcc.exe','g++.exe','windres.exe','objdump.exe','cmake.exe','ninja.exe'){
            if(-not (Test-Path "C:\msys64\mingw64\bin\$t")){throw "Missing C:\msys64\mingw64\bin\$t"}
          }

      # Binaries ignored by git, fetched from the upstream URLs in third_party/driver/SOURCES.json
      # and checked against the hashes recorded there.
      - name: Download libusbK and Inno Setup
        run: |
          $ProgressPreference='SilentlyContinue'  # the progress bar makes Invoke-WebRequest very slow
          $sources=Get-Content -Raw third_party/driver/SOURCES.json | ConvertFrom-Json
          $dl=Join-Path $env:RUNNER_TEMP 'downloads'
          New-Item -ItemType Directory -Force $dl | Out-Null
          foreach($name in 'libusbK-3.1.0.0-bin.7z','innosetup-6.2.2.exe'){
            $s=$sources | Where-Object name -eq $name
            if(-not $s){throw "$name is not listed in SOURCES.json"}
            $file=Join-Path $dl $name
            Invoke-WebRequest -Uri $s.url -OutFile $file -UseBasicParsing
            $hash=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if($hash -ne $s.sha256){throw "$name sha256 $hash does not match SOURCES.json $($s.sha256)"}
          }
      - name: Unpack libusbK runtime
        run: |
          7z x -y (Join-Path $env:RUNNER_TEMP 'downloads\libusbK-3.1.0.0-bin.7z') '-othird_party\driver\libusbK-3.1.0.0'
          if($LASTEXITCODE){throw '7z failed'}
          foreach($f in 'dll\amd64\libusbK.dll','dll\amd64\libusb0.dll','dll\x86\libusbK.dll','dll\x86\libusb0.dll','sys\amd64\libusbK.sys','sys\amd64\WdfCoInstaller01009.dll'){
            if(-not (Test-Path "third_party\driver\libusbK-3.1.0.0\libusbK-3.1.0.0-bin\bin\$f")){throw "Missing libusbK file: $f"}
          }
      - name: Install Inno Setup compiler
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'inno'
          $p=Start-Process -Wait -PassThru -FilePath (Join-Path $env:RUNNER_TEMP 'downloads\innosetup-6.2.2.exe') `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=$dir"
          if($p.ExitCode){throw "Inno Setup install failed: $($p.ExitCode)"}
          if(-not (Test-Path (Join-Path $dir 'ISCC.exe'))){throw 'ISCC.exe not installed'}

      - name: Build driver assistant (och-driver.exe, libwdi.dll)
        run: ./packaging/windows/driver/build-driver.ps1
      - name: Build and stage OCH
        run: ./tools/build.ps1
      - name: Test
        # The sync test depends on wall-clock timing and fails on slow runners; run it locally.
        run: |
          $env:PATH='C:\msys64\mingw64\bin;'+$env:PATH
          ctest --test-dir build --output-on-failure -E '^sync$'
          if($LASTEXITCODE){throw 'Tests failed'}
      - name: Build installer
        # lib.exe for the MSVC import library is found through vswhere on the runner's Visual Studio.
        run: ./packaging/windows/build-package.ps1 -StageDir build/stage -Version $env:VERSION -OutputDir dist -InnoCompiler (Join-Path $env:RUNNER_TEMP 'inno\ISCC.exe')
      - uses: actions/upload-artifact@v7
        with:
          path: dist/OmniCoreHost-${{ env.VERSION }}-win64-setup.exe
          archive: false
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # With archive: false the artifact name is the file name.
      - uses: actions/download-artifact@v8
        with:
          name: OmniCoreHost-${{ env.VERSION }}-linux-x86_64.tar.gz
          path: download
      - uses: actions/download-artifact@v8
        with:
          name: OmniCoreHost-${{ env.VERSION }}-macos-universal.tar.gz
          path: download
      - uses: actions/download-artifact@v8
        with:
          name: OmniCoreHost-${{ env.VERSION }}-win64-setup.exe
          path: download
      - name: Collect files and write SHA256SUMS
        run: |
          mkdir dist
          find download -type f -name 'OmniCoreHost-*' -exec mv {} dist/ \;
          cd dist
          test "$(ls | wc -l)" -eq 3 || { ls -l; echo "Expected 3 files"; exit 1; }
          sha256sum OmniCoreHost-* > SHA256SUMS && cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "OmniCore Host $VERSION" --notes "Draft built by CI. Test before publishing." \
            dist/OmniCoreHost-* dist/SHA256SUMS
